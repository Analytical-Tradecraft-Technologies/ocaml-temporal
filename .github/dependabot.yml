# Check at 06:00 Sydney every calendar day.
# Expanded ecosystem coverage authorized by the repository owner; OPAM remains unsupported.
version: 2
updates:
- package-ecosystem: cargo
  directory: /rust
  allow:
  - dependency-type: all
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
    exclude:
    - rustls-webpki
    - webpki-root-certs
  groups:
    temporal-core:
      patterns:
      - temporalio-client
      - temporalio-common
      - temporalio-sdk-core
      - temporalio-protos
    # Each group below is one upstream project whose crates are released
    # together, so a release otherwise arrives as several PRs that each
    # need a merge-queue run. Unrelated crates (rustls, hyper, serde_json,
    # ...) keep their own PRs. Names are listed explicitly where another
    # publisher could reuse the prefix (futures-retry is not rust-lang's).
    tonic:
      patterns:
      - tonic
      - tonic-*
    prost:
      patterns:
      - prost
      - prost-build
      - prost-derive
      - prost-types
    tokio:
      patterns:
      - tokio
      - tokio-macros
    futures:
      patterns:
      - futures
      - futures-channel
      - futures-core
      - futures-executor
      - futures-io
      - futures-macro
      - futures-sink
      - futures-task
      - futures-util
    tracing:
      patterns:
      - tracing
      - tracing-attributes
      - tracing-core
      - tracing-serde
      - tracing-subscriber
    opentelemetry:
      patterns:
      - opentelemetry
      - opentelemetry-http
      - opentelemetry-otlp
      - opentelemetry-proto
      - opentelemetry_sdk
    windows:
      patterns:
      - windows
      - windows-*
      - windows_*
    wasm-bindgen:
      patterns:
      - wasm-bindgen
      - wasm-bindgen-*
      - js-sys
      - web-sys
    cc:
      patterns:
      - cc
      - find-msvc-tools
    icu4x:
      patterns:
      - icu_*
      - zerovec
      - zerovec-derive
      - yoke
      - yoke-derive
      - zerofrom
      - zerofrom-derive
      - tinystr
      - writeable
      - litemap
      - potential_utf
    serde:
      patterns:
      - serde
      - serde_core
      - serde_derive
    zerocopy:
      patterns:
      - zerocopy
      - zerocopy-derive
    bon:
      patterns:
      - bon
      - bon-macros
  target-branch: master
  open-pull-requests-limit: 10
- package-ecosystem: docker
  directory: /
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
# One entry per supported OCaml series (#1027). Each docker/ocaml-<series>
# directory holds a single digest-pinned ocaml/opam FROM line, so each job sees
# exactly one tag and can refresh its manifest-index digest independently.
# Dependabot compares a candidate tag such as `debian-12-ocaml-5.3` by its
# trailing number (5.3) but derives `update-types` ranges from the whole
# current tag (read as 12.5.2), so `semver-minor` cannot stop a retarget to
# another series. The `versions` ranges below are expressed in that trailing
# number and ignore every later series; the current tag stays eligible, so its
# digest is still refreshed. A range must not cover every version (`>= 0`),
# which Dependabot treats as ignoring the image altogether. Keep the entries in
# step with scripts/ci-matrix.py; test_build_tool_dependencies.sh checks them.
- package-ecosystem: docker
  directory: /docker/ocaml-5.2
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  ignore:
  - dependency-name: ocaml/opam
    versions:
    - '>= 5.3'
- package-ecosystem: docker
  directory: /docker/ocaml-5.3
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  ignore:
  - dependency-name: ocaml/opam
    versions:
    - '>= 5.4'
- package-ecosystem: docker
  directory: /docker/ocaml-5.4
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  ignore:
  - dependency-name: ocaml/opam
    versions:
    - '>= 5.5'
- package-ecosystem: docker
  directory: /docker/ocaml-5.5
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  ignore:
  - dependency-name: ocaml/opam
    versions:
    - '>= 5.6'
- package-ecosystem: docker-compose
  directory: /test/integration/temporal
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  groups:
    temporal-server:
      patterns:
      - temporalio/server
      - temporalio/admin-tools
- package-ecosystem: rust-toolchain
  directory: /rust
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  # The default scope is .github/workflows only; the composite rust-bridge
  # action pins actions too, and was never refreshed without this (#1227).
  directories:
  - /
  - /.github/actions/*
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  groups:
    # upload-artifact and download-artifact are maintained together and
    # usually move the same day; actions/cache/restore and actions/cache/save
    # are two entry points of one action.
    artifact-actions:
      patterns:
      - actions/upload-artifact
      - actions/download-artifact
    cache-actions:
      patterns:
      - actions/cache*
