name: Scheduled bridge stress

# Long-run fuzzing and lifecycle-stress qualification (#506). Pull requests
# and master builds already run every target with a small fixed budget (the
# Rust tests in `cargo test`, the OCaml ones in the @test/bridge/bridge-stress
# step after `dune runtest`); this workflow reruns the same targets
# with large budgets and a fresh seed, on a schedule and on demand. The
# lifecycle stress includes concurrent live activity workers and client calls
# against its gRPC double, whose failure reports land in
# _build/lifecycle-stress/ with the sequential ones. See
# docs/reference/bridge-decoder-fuzz.md and
# docs/reference/bridge-lifecycle-stress.md.

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: Base seed for every fuzzer and stress (decimal or 0x hexadecimal; empty uses the run number)
        required: false
        default: ''
      ocaml_version:
        # Lets a maintainer loop the stresses on another supported compiler,
        # for example 5.3.0 for the multi-Domain SIGSEGV in #1214. The
        # scheduled run always uses 5.5.1.
        description: OCaml compiler for the run
        type: choice
        options: ['5.5.1', '5.4.1', '5.3.0', '5.2.1']
        default: '5.5.1'

permissions:
  contents: read

concurrency:
  group: bridge-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: Fuzz and lifecycle stress (Linux amd64, OCaml ${{ inputs.ocaml_version || '5.5.1' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OCAML_VERSION: ${{ inputs.ocaml_version || '5.5.1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim disposable GitHub-hosted runner disk
        # Deletes the preinstalled SDKs only when less than 40 GiB is free
        # for the bridge and OCaml builds.
        if: runner.environment == 'github-hosted'
        run: sh scripts/reclaim-runner-disk.sh 40
      - name: Select the seed
        id: seed
        shell: bash
        env:
          INPUT_SEED: ${{ inputs.seed }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          seed="${INPUT_SEED:-}"
          if [ -z "$seed" ]; then
            seed="$(printf '0x%08x' "$RUN_NUMBER")"
          fi
          # The whole value must match, not just its first character: the
          # Makefile also rejects anything else, but the seed must never
          # reach make with shell metacharacters in it (#1219).
          if ! printf '%s' "$seed" | grep -Eqx '0x[0-9a-fA-F]+|[0-9]+'; then
            echo "seed must be decimal or 0x hexadecimal" >&2
            exit 1
          fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Stress seed: $seed" >> "$GITHUB_STEP_SUMMARY"
      - name: Write crash core dumps next to the crashing test
        # See the matching build-pr.yml step (#1214): cores land in the
        # crashing Dune action's directory instead of being dropped by apport.
        if: runner.environment == 'github-hosted'
        run: sudo sysctl -w kernel.core_pattern=core.%e.%p
      - name: Run every fuzzer and stress with the qualification budget
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          make stress-qualification \
            STRUCTURED_FUZZ_SEED="$SEED" \
            DECODER_FUZZ_SEED="$SEED" \
            LIFECYCLE_STRESS_SEED="$SEED" \
            CONCURRENT_STRESS_SEED="$SEED"
      - name: Retain reproductions and reports after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bridge-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/structured-fuzz/
            _build/decoder-fuzz/
            _build/lifecycle-stress/
            _build/concurrent-stress/
            _build/default/test/bridge/ocaml-*.bin
            _build/default/test/bridge/concurrent-stress-trace/
            _build/default/test/**/core.*
          if-no-files-found: ignore
          retention-days: 30
