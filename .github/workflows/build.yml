name: Build

on:
  schedule:
    # GitHub Actions cron is UTC. Sydney is UTC+10 in standard time, so this
    # runs at 05:00 Sydney time during the repository's standard-time season.
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: build-scheduled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-amd64:
    uses: ./.github/workflows/rust-bridge.yml
    with:
      runner: ubuntu-24.04
      platform: linux-amd64

  rust-arm64:
    uses: ./.github/workflows/rust-bridge.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64

  quality:
    name: Quality and security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned quality tools
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos@1.48.0
          fallback: none
      - name: Check dependency security and repository quality
        run: make quality

  license-audit:
    name: Dependency license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Audit dependency licenses
        run: make license-check OCAML_VERSION=5.2
      - name: Test Cargo license policy
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            python:3.14-slim-bookworm@sha256:4ff4b92a68355dbdb52584ab3391dff8d371a61d4e063468bfd0130e3189c6d9 \
            sh test/smoke/test_cargo_license_policy.sh
      - name: Audit locked Cargo dependency licenses
        shell: bash
        run: |
          set -o pipefail
          OCAML_IMAGE=ocaml/opam:debian-12-ocaml-5.2 \
            make --silent cargo-metadata \
            | docker run --rm --interactive --network none \
                --volume "$PWD:/workspace:ro" \
                --workdir /workspace \
                python:3.14-slim-bookworm@sha256:4ff4b92a68355dbdb52584ab3391dff8d371a61d4e063468bfd0130e3189c6d9 \
                python3 scripts/check-cargo-licenses.py --metadata -

  temporal-integration:
    # A producer failure must make the existing required consumer check fail.
    if: ${{ !cancelled() }}
    needs: rust-amd64
    name: Temporal/PostgreSQL integration smoke (OCaml 5.5)
    runs-on: ubuntu-24.04
    # Independent live controllers run sequentially while reusing the
    # checked-out source and build cache. Parent/child recovery includes a
    # deliberate 120-second timer and two complete worker generations.
    timeout-minutes: 45
    env:
      # Keep this as one explicit compatibility lane because it starts the
      # complete PostgreSQL/Temporal stack and two OCaml processes.
      OCAML_VERSION: "5.5"
      TEMPORAL_RUST_BRIDGE_DIR: /workspace/_build/rust-bridge
      TEMPORAL_RUST_BRIDGE_KEY: ${{ needs.rust-amd64.outputs.key }}
    steps:
      - name: Require a successful Rust producer
        env:
          RUST_RESULT: ${{ needs.rust-amd64.result }}
        run: test "$RUST_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download the verified Linux amd64 bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-bridge-linux-amd64
          path: _build/rust-bridge
      - name: Reclaim disposable GitHub-hosted runner disk
        # The smoke lane builds several isolated OCaml/Dune trees, each of
        # which statically links the Rust Core bridge. Reclaim the large
        # preinstalled SDKs before the first Compose build so a valid native
        # link cannot fail because the disposable runner ran out of space.
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force --volumes
          df -h /
      - name: Verify workflow start metadata and exact-history worker replacement
        env:
          TEMPORAL_COMPOSE_PROJECT: ocaml-temporal-metadata-ci
        run: |
          trap 'make temporal-clean' EXIT
          make test-temporal-start-metadata-live
      - name: Retain synthetic workflow start metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-start-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/start-metadata-evidence/*.json
            _build/start-metadata-evidence/*.tsv
            _build/start-metadata-evidence/*.roots
            _build/start-metadata-evidence/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Recover the same workflow runs after task failures
        # Independent of the seven existing controllers; any failed
        # assertion fails this job after retaining this gate's evidence.
        run: make test-temporal-task-failure-live
      - name: Retain exact-run task failure recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-task-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/task-failure-live/
          if-no-files-found: warn
          retention-days: 14

      - name: Run the live two-OCaml-binary Temporal Compose smoke
        # Leave time for always() upload after a scenario step times out.
        timeout-minutes: 40
        env:
          TEMPORAL_DIAGNOSTICS_DIR: ${{ github.workspace }}/_build/live-diagnostics
        run: make test-temporal-live-ci
      - name: Upload bounded live diagnostic bundles
        if: always()
        id: live-artifacts
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/live-diagnostics/
          retention-days: 7
          if-no-files-found: warn
      - name: Link live diagnostics and collection status
        if: always()
        env:
          LIVE_ARTIFACT_URL: ${{ steps.live-artifacts.outputs.artifact-url }}
          LIVE_UPLOAD_OUTCOME: ${{ steps.live-artifacts.outcome }}
        run: bash test/integration/temporal/scripts/summarize-live-diagnostics.sh

  verify:
    if: ${{ !cancelled() }}
    needs: [rust-amd64, rust-arm64]
    name: OCaml ${{ matrix.ocaml }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TEMPORAL_RUST_BRIDGE_DIR: /workspace/_build/rust-bridge
      TEMPORAL_RUST_BRIDGE_KEY: ${{ matrix.runner == 'ubuntu-24.04-arm' && needs.rust-arm64.outputs.key || needs.rust-amd64.outputs.key }}
    strategy:
      fail-fast: false
      matrix:
        ocaml:
          - "5.2"
          - "5.3"
          - "5.4"
          - "5.5"
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Require successful Rust producers
        env:
          RUST_AMD64_RESULT: ${{ needs.rust-amd64.result }}
          RUST_ARM64_RESULT: ${{ needs.rust-arm64.result }}
        run: |
          test "$RUST_AMD64_RESULT" = success
          test "$RUST_ARM64_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download the verified platform bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-bridge-linux-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
          path: _build/rust-bridge
      - name: Reclaim disposable GitHub-hosted runner disk
        # Linking the Rust static library into the OCaml test executables can
        # temporarily require more space than the preinstalled Android, .NET,
        # and Haskell toolchains leave on the amd64 hosted image. This guard
        # keeps the destructive cleanup confined to GitHub's disposable
        # runner; arm64 and any future self-hosted runners are left untouched.
        if: matrix.runner == 'ubuntu-24.04' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force --volumes
          df -h /
      - name: Build, lint, and test
        run: make verify OCAML_VERSION=${{ matrix.ocaml }}

  native:
    name: OCaml 5.5 / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # Allow slower Windows runs while leaving room under the 60-minute queue deadline.
    timeout-minutes: ${{ matrix.runner == 'windows-latest' && 55 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            architecture: amd64
            rust-host: x86_64-pc-windows-gnu
            rust-toolchain: 1.97.1-x86_64-pc-windows-gnu
          - label: macOS ARM64
            runner: macos-15
            architecture: arm64
            rust-host: aarch64-apple-darwin
            rust-toolchain: 1.97.1-aarch64-apple-darwin
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/rust
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-toolchain }}
      NATIVE_OCAML_VERSION: "5.5"
      NATIVE_RUST_VERSION: 1.97.1
      NATIVE_ARCH: ${{ matrix.architecture }}
      NATIVE_RUST_HOST: ${{ matrix.rust-host }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up OCaml 5.5
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.5"
          windows-compiler: mingw
          windows-environment: cygwin
      - name: Set up pinned Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          --component clippy --component rustfmt
      - name: Install Protocol Buffers compiler on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Protocol Buffers compiler on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress --yes
      - name: Expose Protocol Buffers compiler to Cygwin
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Chocolatey creates a Windows shim; Cygwin can execute it, but its
          # POSIX mode bits are not guaranteed to include an executable bit.
          protoc_unix_path="$(cygpath -u 'C:\ProgramData\chocolatey\bin\protoc.exe')"
          protoc_windows_path="$(cygpath -w "$protoc_unix_path")"
          test -f "$protoc_unix_path"
          cygpath -w "$(dirname "$protoc_unix_path")" >> "$GITHUB_PATH"
          echo "PROTOC=$protoc_windows_path" >> "$GITHUB_ENV"
          "$protoc_unix_path" --version
      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --assume-depexts --yes
      - name: Prepare verified Rust bridge
        id: bridge
        uses: ./.github/actions/rust-bridge
        with:
          platform: ${{ runner.os == 'Windows' && 'windows-amd64' || 'macos-arm64' }}
          mode: native
      - name: Build, lint, and test natively
        shell: bash
        env:
          TEMPORAL_RUST_BRIDGE_DIR: ${{ github.workspace }}/_build/rust-bridge
          TEMPORAL_RUST_BRIDGE_KEY: ${{ steps.bridge.outputs.key }}
        run: make native-verify
