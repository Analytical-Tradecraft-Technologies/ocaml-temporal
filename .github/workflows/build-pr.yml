name: Build

on:
  workflow_call:
    inputs:
      tier:
        type: string
        default: pr
      bridge-profile:
        type: string
        default: ci
  merge_group:
    types: [checks_requested]
  # Required check names must still be reported for documentation-only changes.
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull-request number remains stable across synchronize events, so a new
  # commit replaces an older queued or running PR run.
  group: build-${{ github.workflow }}-${{ inputs.tier == 'release' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.tier != 'release' }}

jobs:
  changes:
    name: Detect changed code paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changed-paths.outputs.code }}
      linux: ${{ steps.matrix.outputs.linux }}
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate changed paths
        id: changed-paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] && [ -z "$HEAD_SHA" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The master ruleset requires concrete matrix-expanded check names.
          # Skipping jobs before matrix expansion omits those names even when
          # the change is only documentation, so every PR and merge group must
          # run the full required graph. Keep this comparison as a fail-closed
          # validation of the event's base/head refs.
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > /dev/null
          echo 'code=true' >> "$GITHUB_OUTPUT"
      - name: Select exact compiler versions
        id: matrix
        env:
          BUILD_TIER: ${{ inputs.tier || 'pr' }}
        run: python3 scripts/ci-matrix.py "$BUILD_TIER" >> "$GITHUB_OUTPUT"

  rust-amd64:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    uses: ./.github/workflows/rust-bridge.yml
    with:
      runner: ubuntu-24.04
      platform: linux-amd64
      profile: ${{ inputs.bridge-profile || 'ci' }}

  rust-arm64:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    uses: ./.github/workflows/rust-bridge.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      profile: ${{ inputs.bridge-profile || 'ci' }}

  rust-macos:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    uses: ./.github/workflows/rust-bridge.yml
    with:
      runner: macos-15
      platform: macos-arm64
      profile: ${{ inputs.bridge-profile || 'ci' }}

  rust-windows:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    uses: ./.github/workflows/rust-bridge.yml
    with:
      runner: windows-latest
      platform: windows-amd64
      profile: ${{ inputs.bridge-profile || 'ci' }}

  quality:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Quality and security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test matrix selection and artifact failure cases
        run: make test-ci-artifacts
      - name: Install pinned quality tools
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos@1.48.0
          fallback: none
      - name: Check dependency security and repository quality
        run: make quality

  license-audit:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Dependency license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Audit dependency licenses
        run: make license-check OCAML_VERSION=5.2
      - name: Test Cargo license policy
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            python:3.14-slim-bookworm@sha256:4ff4b92a68355dbdb52584ab3391dff8d371a61d4e063468bfd0130e3189c6d9 \
            sh test/smoke/test_cargo_license_policy.sh
      - name: Audit locked Cargo dependency licenses
        shell: bash
        run: |
          set -o pipefail
          OCAML_VERSION=5.2 \
            make --silent cargo-metadata \
            | docker run --rm --interactive --network none \
                --volume "$PWD:/workspace:ro" \
                --workdir /workspace \
                python:3.14-slim-bookworm@sha256:4ff4b92a68355dbdb52584ab3391dff8d371a61d4e063468bfd0130e3189c6d9 \
                python3 scripts/check-cargo-licenses.py --metadata -

  temporal-integration:
    # Required checks must fail, rather than be skipped, when a producer fails.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    needs: [changes, verify]
    name: Temporal/PostgreSQL integration smoke (OCaml 5.5)
    runs-on: ubuntu-24.04
    # Independent live controllers run sequentially while reusing the
    # checked-out source and build cache. Parent/child recovery includes a
    # deliberate 120-second timer and two complete worker generations.
    timeout-minutes: 45
    env:
      # Keep this as one explicit compatibility lane because it starts the
      # complete PostgreSQL/Temporal stack and two OCaml processes.
      OCAML_VERSION: "5.5.1"
      TEMPORAL_PREBUILT_SMOKE: "1"
    steps:
      # Always make failure-reporting scripts available, even if a producer
      # failed and the dependency gate below stops the live test steps.
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Require successful OCaml builds
        env:
          OCAML_RESULT: ${{ needs.verify.result }}
        run: test "$OCAML_RESULT" = success
      - name: Download compiled smoke executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: temporal-smoke-linux-amd64-ocaml-5.5.1
          path: _build/smoke-artifact
      - name: Verify and unpack the exact tested executables
        run: python3 scripts/smoke-artifact.py unpack --directory _build/smoke-artifact --commit "$GITHUB_SHA" --ocaml "$OCAML_VERSION"
      - name: Reclaim disposable GitHub-hosted runner disk
        # The smoke lane downloads executables that statically link Rust.
        # Leave enough space for their extraction and the live server images. Reclaim the large
        # preinstalled SDKs before the first Compose build so a valid native
        # link cannot fail because the disposable runner ran out of space.
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force --volumes
          df -h /
      - name: Verify workflow start metadata and exact-history worker replacement
        env:
          TEMPORAL_COMPOSE_PROJECT: ocaml-temporal-metadata-ci
        run: |
          trap 'make temporal-clean' EXIT
          make test-temporal-start-metadata-live
      - name: Retain synthetic workflow start metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-start-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/start-metadata-evidence/*.json
            _build/start-metadata-evidence/*.tsv
            _build/start-metadata-evidence/*.roots
            _build/start-metadata-evidence/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Recover the same workflow runs after task failures
        # Independent of the seven existing controllers; any failed
        # assertion fails this job after retaining this gate's evidence.
        run: make test-temporal-task-failure-live
      - name: Retain exact-run task failure recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-task-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/task-failure-live/
          if-no-files-found: warn
          retention-days: 14

      - name: Run the live two-OCaml-binary Temporal Compose smoke
        # Leave time for always() upload after a scenario step times out.
        timeout-minutes: 40
        env:
          TEMPORAL_DIAGNOSTICS_DIR: ${{ github.workspace }}/_build/live-diagnostics
        run: make test-temporal-live-ci
      - name: Upload bounded live diagnostic bundles
        if: always()
        id: live-artifacts
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/live-diagnostics/
          retention-days: 7
          if-no-files-found: warn
      - name: Link live diagnostics and collection status
        if: always()
        env:
          LIVE_ARTIFACT_URL: ${{ steps.live-artifacts.outputs.artifact-url }}
          LIVE_UPLOAD_OUTCOME: ${{ steps.live-artifacts.outcome }}
        run: bash test/integration/temporal/scripts/summarize-live-diagnostics.sh

  verify:
    # Override the implicit success() dependency check so the gate below runs.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    needs: [changes, rust-amd64, rust-arm64]
    name: OCaml ${{ matrix.label }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TEMPORAL_RUST_BRIDGE_DIR: /workspace/_build/rust-bridge
      OCAML_ARTIFACT_COMMIT: ${{ github.sha }}
      RUST_BRIDGE_PROFILE: ${{ inputs.bridge-profile || 'ci' }}
      TEMPORAL_RUST_BRIDGE_KEY: ${{ matrix.runner == 'ubuntu-24.04-arm' && needs.rust-arm64.outputs.key || needs.rust-amd64.outputs.key }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.linux) }}
    steps:
      - name: Require successful Rust producers
        env:
          RUST_AMD64_RESULT: ${{ needs.rust-amd64.result }}
          RUST_ARM64_RESULT: ${{ needs.rust-arm64.result }}
        run: |
          test "$RUST_AMD64_RESULT" = success
          test "$RUST_ARM64_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download the verified platform bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-bridge-linux-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
          path: _build/rust-bridge
      - name: Reclaim disposable GitHub-hosted runner disk
        # Linking the Rust static library into the OCaml test executables can
        # temporarily require more space than the preinstalled Android, .NET,
        # and Haskell toolchains leave on the amd64 hosted image. This guard
        # keeps the destructive cleanup confined to GitHub's disposable
        # runner; arm64 and any future self-hosted runners are left untouched.
        if: matrix.runner == 'ubuntu-24.04' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force --volumes
          df -h /
      - name: Build, lint, and test
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
        run: make verify
      - name: Build API documentation with odoc warnings as errors
        # Rendered documentation is compiler-independent, so one lane present
        # in every tier checks it. The docs image extends this lane's cached
        # development image with the exact CI-only odoc closure.
        if: matrix.ocaml == '5.2.1' && matrix.runner == 'ubuntu-24.04'
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
        run: make docs
      # `make verify` already enforces the replay history corpus on every
      # matrix leg through `dune runtest`. One leg reruns the same offline
      # runner (seconds, reusing the build) to retain the machine-readable
      # report that Core pin and Dependabot Cargo PRs cite as upgrade
      # evidence; it also runs after a failed verify so a mismatch is
      # recorded per case.
      - name: Write the replay history corpus upgrade report
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-24.04' && matrix.ocaml == '5.5.1' }}
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
        run: make test-history-corpus-upgrade HISTORY_CORPUS_SDK_COMMIT="$GITHUB_SHA"
      - name: Upload the replay history corpus upgrade report
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-24.04' && matrix.ocaml == '5.5.1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: history-corpus-report-linux-amd64-ocaml-${{ matrix.ocaml }}
          path: _build/history-corpus/report.json
          if-no-files-found: warn
          retention-days: ${{ vars.RUST_BRIDGE_ARTIFACT_RETENTION_DAYS || '90' }}
      - name: Package and consume the compiled OCaml library
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
        run: make library-artifact
      - name: Upload the verified OCaml library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocaml-sdk-linux-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}-ocaml-${{ matrix.ocaml }}
          path: _build/ocaml-library-artifact/
          if-no-files-found: error
          retention-days: ${{ vars.RUST_BRIDGE_ARTIFACT_RETENTION_DAYS || '90' }}
          compression-level: 0
      - name: Compile the live smoke executables once
        if: matrix.runner == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
        run: |
          make build-smoke-executables
          python3 scripts/smoke-artifact.py pack --directory _build/smoke-artifact --commit "$GITHUB_SHA" --ocaml "$OCAML_VERSION"
      - name: Upload compiled smoke executables
        if: matrix.runner == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temporal-smoke-linux-amd64-ocaml-5.5.1
          path: _build/smoke-artifact/
          if-no-files-found: error
          retention-days: ${{ vars.RUST_BRIDGE_ARTIFACT_RETENTION_DAYS || '90' }}
          compression-level: 0

  native-macos:
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    needs: [changes, rust-macos]
    name: OCaml ${{ matrix.label }} / macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/rust
      RUSTUP_TOOLCHAIN: 1.99.0-aarch64-apple-darwin
      NATIVE_OCAML_VERSION: ${{ matrix.ocaml }}
      OCAML_ARTIFACT_COMMIT: ${{ github.sha }}
      RUST_BRIDGE_PROFILE: ${{ inputs.bridge-profile || 'ci' }}
      NATIVE_RUST_VERSION: 1.99.0
      NATIVE_ARCH: arm64
      NATIVE_RUST_HOST: aarch64-apple-darwin
      TEMPORAL_RUST_BRIDGE_DIR: ${{ github.workspace }}/_build/rust-bridge
      TEMPORAL_RUST_BRIDGE_KEY: ${{ needs.rust-macos.outputs.key }}
    steps:
      - name: Require a successful Rust producer
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust-macos.result }}
        run: test "$RUST_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up the exact OCaml compiler
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - name: Set up pinned Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          --component clippy --component rustfmt
      - name: Install Protocol Buffers compiler on macOS
        run: brew install protobuf
      - name: Install and verify locked OCaml dependencies
        # Exact temporal-sdk.opam.locked versions (compiler packages excepted);
        # fails if the switch drifts from the audited lock.
        shell: bash
        run: sh scripts/opam-locked-deps.sh install --assume-depexts
      - name: Download the verified platform bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-bridge-macos-arm64
          path: _build/rust-bridge
      - name: Build, lint, and test natively
        shell: bash
        env:
          TEMPORAL_RUST_BRIDGE_DIR: ${{ github.workspace }}/_build/rust-bridge
          TEMPORAL_RUST_BRIDGE_KEY: ${{ needs.rust-macos.outputs.key }}
        run: make native-verify
      - name: Package and consume the compiled OCaml library
        shell: bash
        run: make native-library-artifact OCAML_ARTIFACT_PLATFORM=macos-arm64 PYTHON=python3
      - name: Upload the verified OCaml library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocaml-sdk-macos-arm64-ocaml-${{ matrix.ocaml }}
          path: _build/ocaml-library-artifact/
          if-no-files-found: error
          retention-days: ${{ vars.RUST_BRIDGE_ARTIFACT_RETENTION_DAYS || '90' }}
          compression-level: 0

  native-windows:
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    needs: [changes, rust-windows]
    name: OCaml ${{ matrix.label }} / Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/rust
      RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-gnu
      NATIVE_OCAML_VERSION: ${{ matrix.ocaml }}
      OCAML_ARTIFACT_COMMIT: ${{ github.sha }}
      RUST_BRIDGE_PROFILE: ${{ inputs.bridge-profile || 'ci' }}
      NATIVE_RUST_VERSION: 1.99.0
      NATIVE_ARCH: amd64
      NATIVE_RUST_HOST: x86_64-pc-windows-gnu
      TEMPORAL_RUST_BRIDGE_DIR: ${{ github.workspace }}/_build/rust-bridge
      TEMPORAL_RUST_BRIDGE_KEY: ${{ needs.rust-windows.outputs.key }}
    steps:
      - name: Require a successful Rust producer
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust-windows.result }}
        run: test "$RUST_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up the exact OCaml compiler
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          windows-compiler: mingw
          windows-environment: cygwin
      - name: Set up pinned Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          --component clippy --component rustfmt
      - name: Install Protocol Buffers compiler on Windows
        run: choco install protoc --no-progress --yes
      - name: Expose Protocol Buffers compiler to Cygwin
        shell: bash
        run: |
          set -euo pipefail
          # Chocolatey creates a Windows shim; Cygwin can execute it, but its
          # POSIX mode bits are not guaranteed to include an executable bit.
          protoc_unix_path="$(cygpath -u 'C:\ProgramData\chocolatey\bin\protoc.exe')"
          protoc_windows_path="$(cygpath -w "$protoc_unix_path")"
          test -f "$protoc_unix_path"
          cygpath -w "$(dirname "$protoc_unix_path")" >> "$GITHUB_PATH"
          echo "PROTOC=$protoc_windows_path" >> "$GITHUB_ENV"
          "$protoc_unix_path" --version
      - name: Install and verify locked OCaml dependencies
        # Exact temporal-sdk.opam.locked versions (compiler packages excepted);
        # fails if the switch drifts from the audited lock.
        shell: bash
        run: sh scripts/opam-locked-deps.sh install --assume-depexts
      - name: Download the verified platform bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-bridge-windows-amd64
          path: _build/rust-bridge
      - name: Build, lint, and test natively
        shell: bash
        env:
          TEMPORAL_RUST_BRIDGE_DIR: ${{ github.workspace }}/_build/rust-bridge
          TEMPORAL_RUST_BRIDGE_KEY: ${{ needs.rust-windows.outputs.key }}
        run: make native-verify
      - name: Package and consume the compiled OCaml library
        shell: bash
        run: make native-library-artifact OCAML_ARTIFACT_PLATFORM=windows-amd64 PYTHON=python
      - name: Upload the verified OCaml library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocaml-sdk-windows-amd64-ocaml-${{ matrix.ocaml }}
          path: _build/ocaml-library-artifact/
          if-no-files-found: error
          retention-days: ${{ vars.RUST_BRIDGE_ARTIFACT_RETENTION_DAYS || '90' }}
          compression-level: 0
