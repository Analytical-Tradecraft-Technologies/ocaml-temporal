name: Prepare verified Rust bridge
description: Reuse or build the platform libraries independently of the OCaml compiler version
inputs:
  platform:
    description: Native platform identity used in cache and artifact names
    required: true
  mode:
    description: docker for Debian Linux consumers, native for Windows and macOS
    required: true
outputs:
  key:
    description: Exact identity that consumers must validate
    value: ${{ steps.identity.outputs.key }}
runs:
  using: composite
  steps:
    - name: Identify Rust inputs and native environment
      id: identity
      shell: bash
      env:
        BRIDGE_PLATFORM: ${{ inputs.platform }}
        BRIDGE_MODE: ${{ inputs.mode }}
        # Include tests and build machinery: a previously passing library is
        # reusable only when its validation and construction inputs match too.
        SOURCE_HASH: ${{ hashFiles('rust/**', 'scripts/*rust*', 'test/smoke/test_rust*', 'Dockerfile.rust-ci', 'Dockerfile.dev', 'Makefile', '.github/actions/rust-bridge/action.yml', '.github/workflows/build*.yml', '.github/workflows/rust-bridge.yml') }}
      run: |
        set -euo pipefail
        test "$(sh scripts/rust-bridge-artifact.sh platform .)" = "$BRIDGE_PLATFORM"
        if [ "$BRIDGE_MODE" = docker ]; then
          environment=debian12-pinned-rust-image
        elif [ "$BRIDGE_MODE" = native ]; then
          environment=$(
            set -e
            printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}"
            rustc -vV
            protoc --version
            cc --version
          )
        else
          echo "unsupported bridge build mode: $BRIDGE_MODE" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          environment_hash=$(printf '%s' "$environment" | sha256sum | cut -d ' ' -f 1)
        else
          environment_hash=$(printf '%s' "$environment" | shasum -a 256 | cut -d ' ' -f 1)
        fi
        echo "key=rust-bridge-v1-$BRIDGE_PLATFORM-$environment_hash-$SOURCE_HASH" >> "$GITHUB_OUTPUT"
    - name: Restore verified platform libraries
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: _build/rust-bridge
        key: ${{ steps.identity.outputs.key }}
        # No fallback keys: a different source, compiler, or ABI is a miss.
    - name: Build and test Rust once on a cache miss
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BRIDGE_MODE: ${{ inputs.mode }}
        RUST_BRIDGE_KEY: ${{ steps.identity.outputs.key }}
        # Keep file/line backtraces, debug assertions, and the dev optimization
        # level, without shipping full Rust type debug data to every consumer.
        CARGO_INCREMENTAL: "0"
        CARGO_PROFILE_DEV_DEBUG: line-tables-only
        CARGO_PROFILE_TEST_DEBUG: line-tables-only
      run: |
        set -euo pipefail
        if [ "$BRIDGE_MODE" = docker ]; then
          make rust-bridge
        else
          make native-rust-bridge
        fi
    - name: Validate the complete bundle
      shell: bash
      env:
        BRIDGE_KEY: ${{ steps.identity.outputs.key }}
      run: sh scripts/rust-bridge-artifact.sh validate . _build/rust-bridge "$BRIDGE_KEY"
    - name: Seed the shared default-branch cache
      # PR merge-ref caches cannot be read by merge queue/master. Only master
      # publishes, after the Rust checks have passed; every event can restore.
      if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: _build/rust-bridge
        key: ${{ steps.identity.outputs.key }}
    - name: Share libraries with this run's consumers
      if: inputs.mode == 'docker'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: rust-bridge-${{ inputs.platform }}
        path: _build/rust-bridge/
        if-no-files-found: error
        compression-level: 1
        retention-days: 1
        overwrite: true
