[workspace]
members = ["core-bridge"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Analytical-Tradecraft-Technologies/ocaml-temporal"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.23.0"
flate2 = "1.1.10"
h2 = "0.4.19"
http = "1.5.0"
prost = "0.14.4"
serde = "1.0.228"
serde_json = "1.0.150"
prost-wkt-types = "0.7.1"
temporalio-client = { git = "https://github.com/temporalio/sdk-core.git", rev = "95e97686a079dcfe6c42e3254b2f3f5e3d97408f", default-features = false, features = ["core-based-sdk", "tls-ring"] }
temporalio-common = { git = "https://github.com/temporalio/sdk-core.git", rev = "95e97686a079dcfe6c42e3254b2f3f5e3d97408f", default-features = false }
temporalio-sdk-core = { git = "https://github.com/temporalio/sdk-core.git", rev = "95e97686a079dcfe6c42e3254b2f3f5e3d97408f", default-features = false, features = ["tls-ring"] }
temporalio-protos = { git = "https://github.com/temporalio/sdk-core.git", rev = "95e97686a079dcfe6c42e3254b2f3f5e3d97408f" }
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
uuid = { version = "1.23.4", default-features = false, features = ["v4"] }

# Linked by Dune's release profile, which [opam install] and [dune build -p]
# select, and by published release bridge bundles (#779). Other Dune profiles
# use Cargo's dev profile for fast local iteration.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# The bridge contains Rust panics with catch_unwind at the C ABI boundary and
# reports them to OCaml as typed failures. Aborting on panic would turn those
# contained failures into process aborts, so unwinding is pinned here rather
# than left to Cargo's default.
panic = "unwind"
