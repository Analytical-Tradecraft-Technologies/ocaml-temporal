# The single Rust version pin. The Makefile, CI workflows and both Linux Rust
# images read this channel through scripts/rust-version.sh, so a bump here
# (including Dependabot's rust-toolchain update) moves every gate at once.
# test/smoke/test_rust_toolchain.sh checks that the running rustc matches.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
