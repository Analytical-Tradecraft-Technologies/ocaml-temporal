[package]
name = "ocaml-temporal-core-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
prost-wkt-types.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
temporalio-sdk-core.workspace = true
temporalio-protos.workspace = true
tokio.workspace = true
uuid.workspace = true

# Test-only doubles. These crates are already locked transitively through
# Temporal Core's gRPC transport; they let integration tests serve a minimal
# plaintext HTTP/2 gRPC endpoint without a Temporal server, and `flate2`
# decodes the gzip-compressed request messages Core's client sends to it.
[dev-dependencies]
flate2.workspace = true
h2.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["net"] }
